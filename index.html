<!DOCTYPE html>
<html>

<head>
    <title>ASCII Value Converter</title>
    <link rel="stylesheet" href="style.css"></link
</head>

<body>

    <div class="container">

        <h1>ASCII Value Converter</h1>

        <input
            type="text"
            id="inputValue"
            placeholder="Enter character or ASCII code"
        >

        <button id="convertBtn">Convert</button>
        <button id="clearBtn">Clear</button>

        <p id="result"></p>

        

    </div>

    <script src="script.js"></script>

</body>

</html>
